# 本番デプロイ
#
# トリガは main への push（＝PRのマージ）と手動実行のみ。**pull_request は入れない**。
# pull_request イベントで実行されるワークフローはフォーク側のものなので、
# それをセルフホストランナーに向けられると、他人のコードが自宅サーバーで実行されてしまう。
name: Deploy

on:
  push:
    branches: [main]
    # 本番に配るファイルが変わったときだけデプロイする（ワークフローやドキュメントだけの
    # 変更で本番の Bot を再起動しない）。デプロイスクリプトが配るのはこの2つだけ
    paths:
      - "medicine_bot.py"
      - "requirements.txt"
  workflow_dispatch:

# デプロイの多重実行を防ぐ。実行中のものは打ち切らず順番に流す
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/validate.yml

  deploy:
    needs: validate
    # 手動実行で main 以外のブランチを選んでも、本番には入れない
    # （ブランチを試すときは deploy-staging.yml を使う）
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, medicine-bot]
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true

      # 実行されるのはリポジトリ内の deploy/medicine-bot-deploy ではなく、サーバーに
      # 設置した root 所有のコピー。sudoers はこれとテスト用 Bot 用の2つだけを NOPASSWD で許可している。
      # 配置・再起動・起動確認（失敗時は元に戻す）までをこの中で行う
      - name: デプロイ
        run: sudo /usr/local/sbin/medicine-bot-deploy
